[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apv_physics"
version = "0.1.0"
description = "Live physics engine for AgriPV Lab: panel energy and ground light for any layout, numpy only"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "apv_core"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "pvlib==0.16.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
