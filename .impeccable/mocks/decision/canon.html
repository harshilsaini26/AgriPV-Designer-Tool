<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#FFFFFF;--ink:#0F172A;--mute:#64748B;--blue:#2563EB;--green:#16A34A;--line:#E2E8F0}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:240px 1fr}
.side{background:var(--card);border-right:1px solid var(--line);padding:24px 18px}
.side b{font-size:18px}
.side a{display:block;padding:9px 10px;margin-top:6px;border-radius:6px;font-size:14px;color:var(--mute);text-decoration:none}
.side a.on{background:#EFF6FF;color:var(--blue);font-weight:600}
.main{padding:24px 32px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:center}
.head h1{font-size:28px;font-weight:700}
.btn{background:var(--blue);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.k small{color:var(--mute);font-size:13px}
.k strong{display:block;font-size:30px;font-weight:700;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;flex:1;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:16px;font-weight:600;margin-bottom:10px}
</style></head>
<body>
<aside class="side"><b>AgriPV Lab</b><a>Map</a><a class="on">Model</a><a>Compare</a><a>Reports</a><a>Methodology</a></aside>
<main class="main">
  <div class="head"><h1>Nashik, Maharashtra</h1><span class="btn">Export report</span></div>
  <div class="kpis">
    <div class="k"><small>LER</small><strong>1.45</strong></div>
    <div class="k"><small>Equity IRR</small><strong>14.8%</strong></div>
    <div class="k"><small>Farm retention</small><strong>67%</strong></div>
    <div class="k"><small>Payback</small><strong>6.4 yr</strong></div>
  </div>
  <div class="row">
    <div class="panel"><h2>District map</h2>
      <svg viewBox="0 0 400 360" width="100%" height="360"><path d="M90 60 C200 20 330 50 350 140 C370 240 300 320 190 320 C90 320 40 240 50 150 C55 100 70 70 90 60Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M150 120 C220 100 280 130 280 190 C280 250 220 270 170 250 C120 230 110 150 150 120Z" fill="#93C5FD"/></svg></div>
    <div class="panel"><h2>LER vs GCR</h2>
      <svg viewBox="0 0 600 360" width="100%" height="360">
        <g stroke="#E2E8F0"><line x1="30" x2="590" y1="320" y2="320"/><line x1="30" x2="590" y1="200" y2="200"/><line x1="30" x2="590" y1="80" y2="80"/></g>
        <polyline fill="none" stroke="#16A34A" stroke-width="3" points="30,150 86,158 142,168 198,180 254,194 310,210 366,228 422,246 478,264 534,280 590,294"/>
        <polyline fill="none" stroke="#2563EB" stroke-width="3" points="30,290 86,276 142,262 198,248 254,234 310,220 366,206 422,192 478,178 534,164 590,150"/>
        <polyline fill="none" stroke="#0F172A" stroke-width="3" points="30,120 86,106 142,94 198,84 254,76 310,70 366,66 422,62 478,58 534,52 590,46"/>
      </svg></div>
  </div>
</main>
</body></html>
