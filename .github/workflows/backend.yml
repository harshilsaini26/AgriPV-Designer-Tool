name: backend

on:
  push:
    paths: ["backend/**", "apv_core/**", "apv_physics/**", "data/app/**", "pyproject.toml", "vercel.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "apv_core/**", "apv_physics/**", "data/app/**", "pyproject.toml", "vercel.json", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv pip install --system -r pyproject.toml pytest httpx ruff
      - run: ruff check backend
      - run: pytest backend/tests
